[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ios-pose-estimation"
version = "0.1.0"
description = "Monocular pose estimation of a target spacecraft for rendezvous and docking"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pillow",
]

[project.optional-dependencies]
test = ["pytest"]
train = ["torch", "torchvision"]

[tool.setuptools.packages.find]
where = ["src"]
